# La API key NO va aquí. Se guarda como secreto cifrado:
#   npx wrangler secret put GROQ_API_KEY
#
# Opcionales, estos sí como variables normales:
# [vars]
# GROQ_MODEL = "openai/gpt-oss-120b"   # fijar modelo; si se omite, se resuelve solo
# APP_TOKEN  = "una-cadena-cualquiera" # exige la cabecera X-App-Token
